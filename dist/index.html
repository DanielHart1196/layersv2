<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layers</title>

    <!-- Load MapLibre from CDN - faster initial load -->
    <script defer src="https://unpkg.com/maplibre-gl@5.21.1/dist/maplibre-gl.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.21.1/dist/maplibre-gl.css">


    <!-- Preconnect to CDN -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin>

    <script type="module" crossorigin src="./assets/main-BsLMHV1Z.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-Tch5Gsal.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="map-shell">
        <div class="map-stage" id="mapStage">
        </div>
      </section>
      <div class="layer-menu" id="layerMenu">
        <div class="layer-menu-appearance" id="layerMenuAppearance">
          <button
            class="layer-menu-appearance-button layer-menu-earth-button"
            id="layerMenuEarthButton"
            type="button"
            aria-label="Show earth styling rows"
            aria-expanded="false"
            aria-controls="layerMenuPanel"
          ></button>
          <button
            class="layer-menu-appearance-button"
            id="layerMenuScreenButton"
            type="button"
            aria-label="Show settings rows"
            aria-expanded="false"
            aria-controls="layerMenuPanel"
          ></button>
        </div>
        <button
          class="layer-menu-button"
          id="layerMenuButton"
          type="button"
          aria-label="Open layer menu"
          aria-expanded="false"
          aria-controls="layerMenuPanel"
        >
          <svg class="layer-menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="layer-menu-icon-border" d="M4 8h16"></path>
            <path class="layer-menu-icon-border" d="M4 16h16"></path>
            <path class="layer-menu-icon-mark" d="M4 8h16"></path>
            <path class="layer-menu-icon-mark" d="M4 16h16"></path>
          </svg>
          <svg class="layer-menu-button-close-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="layer-menu-icon-border" d="M18 6 6 18"></path>
            <path class="layer-menu-icon-border" d="m6 6 12 12"></path>
            <path class="layer-menu-icon-mark" d="M18 6 6 18"></path>
            <path class="layer-menu-icon-mark" d="m6 6 12 12"></path>
          </svg>
        </button>
        <div class="layer-menu-reload-menu" id="layerMenuReloadMenu" role="menu" aria-label="Reload options">
          <button class="layer-menu-reload-menu-item" id="layerMenuReloadButton" type="button" role="menuitem">
            Reload
          </button>
          <button class="layer-menu-reload-menu-item" id="layerMenuHardReloadButton" type="button" role="menuitem">
            Hard reload
          </button>
          <button class="layer-menu-reload-menu-item" id="layerMenuClearCacheReloadButton" type="button" role="menuitem">
            Clear cache reload
          </button>
        </div>
        <div class="layer-menu-panel" id="layerMenuPanel" role="menu" aria-label="Layer groups">
          <div class="layer-menu-panel-scroll" id="layerMenuPanelScroll">
            <button class="layer-menu-row" id="earthRow" type="button" role="menuitem">Earth</button>
            <button class="layer-menu-row" id="empiresRow" type="button" role="menuitem">Empires</button>
          </div>
          <div class="layer-menu-panel-footer" id="layerMenuPanelFooter"></div>
        </div>
      </div>
    </main>
  </body>
</html>
