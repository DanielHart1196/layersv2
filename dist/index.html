<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layers</title>
    <!-- Preconnect to CDN -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin>

    <script type="module" crossorigin src="./assets/main-CcLIJ4ir.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-CAAjgoL-.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="map-shell">
        <div class="map-stage" id="mapStage">
        </div>
      </section>
      <div class="map-title-shell" id="mapTitleShell">
        <p
          class="map-title"
          id="mapTitle"
          contenteditable="true"
          spellcheck="false"
          enterkeyhint="done"
          role="textbox"
          aria-label="Map title"
        >Layers</p>
      </div>
      <div class="layer-menu" id="layerMenu">
        <div class="layer-menu-appearance" id="layerMenuAppearance">
          <button
            class="layer-menu-appearance-button layer-menu-earth-button"
            id="layerMenuEarthButton"
            type="button"
            aria-label="Show earth styling rows"
            aria-expanded="false"
            aria-controls="layerMenuPanel"
          ></button>
          <button
            class="layer-menu-appearance-button"
            id="layerMenuScreenButton"
            type="button"
            aria-label="Show settings rows"
            aria-expanded="false"
            aria-controls="layerMenuPanel"
          ></button>
        </div>
        <button
          class="layer-menu-button"
          id="layerMenuButton"
          type="button"
          aria-label="Open layer menu"
          aria-expanded="false"
          aria-controls="layerMenuPanel"
        >
          <svg class="layer-menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="layer-menu-icon-border" d="M4 8h16"></path>
            <path class="layer-menu-icon-border" d="M4 16h16"></path>
            <path class="layer-menu-icon-mark" d="M4 8h16"></path>
            <path class="layer-menu-icon-mark" d="M4 16h16"></path>
          </svg>
          <svg class="layer-menu-button-close-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="layer-menu-icon-border" d="M18 6 6 18"></path>
            <path class="layer-menu-icon-border" d="m6 6 12 12"></path>
            <path class="layer-menu-icon-mark" d="M18 6 6 18"></path>
            <path class="layer-menu-icon-mark" d="m6 6 12 12"></path>
          </svg>
        </button>
        <div class="layer-menu-reload-menu" id="layerMenuReloadMenu" role="menu" aria-label="Reload options">
          <button class="layer-menu-reload-menu-item" id="layerMenuReloadButton" type="button" role="menuitem">
            Reload
          </button>
          <button class="layer-menu-reload-menu-item" id="layerMenuHardReloadButton" type="button" role="menuitem">
            Hard reload
          </button>
          <button class="layer-menu-reload-menu-item" id="layerMenuClearCacheReloadButton" type="button" role="menuitem">
            Clear cache reload
          </button>
        </div>
        <div class="layer-menu-panel" id="layerMenuPanel" role="menu" aria-label="Layer groups">
          <div class="layer-menu-panel-scroll" id="layerMenuPanelScroll">
            <button class="layer-menu-row" id="earthRow" type="button" role="menuitem">Earth</button>
            <button class="layer-menu-row" id="empiresRow" type="button" role="menuitem">Empires</button>
          </div>
          <div class="layer-menu-panel-footer" id="layerMenuPanelFooter"></div>
        </div>
      </div>
      <div class="map-share-wrap" id="mapShareWrap">
        <button class="map-share-print" id="printModeBtn" type="button">Print</button>
        <span class="map-share-separator" aria-hidden="true">|</span>
        <button class="map-share-button" id="shareBtn" type="button" title="Copy share URL" aria-label="Copy share URL">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" aria-hidden="true" focusable="false">
            <circle cx="13.5" cy="3.5" r="2" fill="currentColor"></circle>
            <circle cx="4.5" cy="9" r="2" fill="currentColor"></circle>
            <circle cx="13.5" cy="14.5" r="2" fill="currentColor"></circle>
            <line x1="6.3" y1="8.1" x2="11.7" y2="4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></line>
            <line x1="6.3" y1="9.9" x2="11.7" y2="13.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></line>
          </svg>
        </button>
      </div>
      <div class="map-share-popup" id="sharePopup" hidden>
        <p class="map-share-popup-title" id="sharePopupTitle">Map URL copied</p>
        <p class="map-share-popup-url" id="sharePopupUrl"></p>
        <p class="map-share-popup-hint" id="sharePopupHint">Send this link to open the same map state.</p>
      </div>
    </main>
  </body>
</html>
